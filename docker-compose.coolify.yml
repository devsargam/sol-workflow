services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL}
        NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL}
      NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK}
      NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.solworkflow-web.rule=Host(`dolphinflow.xyz`)
      - traefik.http.routers.solworkflow-web.entrypoints=http,https
      - traefik.http.routers.solworkflow-web.tls=true
      - traefik.http.routers.solworkflow-web.tls.certresolver=letsencrypt
      - traefik.http.services.solworkflow-web.loadbalancer.server.port=3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "3000:3000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      SOLANA_WS_URL: ${SOLANA_WS_URL}
      SOLANA_NETWORK: ${SOLANA_NETWORK}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PRIVY_APP_ID: ${PRIVY_APP_ID}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET}
      ENABLE_CRON: ${ENABLE_CRON:-true}
    labels:
      - traefik.enable=true
      - traefik.http.routers.solworkflow-api.rule=Host(`api.dolphinflow.xyz`)
      - traefik.http.routers.solworkflow-api.entrypoints=http,https
      - traefik.http.routers.solworkflow-api.tls=true
      - traefik.http.routers.solworkflow-api.tls.certresolver=letsencrypt
      - traefik.http.services.solworkflow-api.loadbalancer.server.port=3001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "3001:3001"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      SOLANA_WS_URL: ${SOLANA_WS_URL}
      SOLANA_NETWORK: ${SOLANA_NETWORK}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      RATE_LIMIT_DURATION: ${RATE_LIMIT_DURATION}
    depends_on:
      - api
    restart: unless-stopped

  listener:
    build:
      context: .
      dockerfile: docker/listener/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      SOLANA_WS_URL: ${SOLANA_WS_URL}
      SOLANA_NETWORK: ${SOLANA_NETWORK}
    depends_on:
      - api
    restart: unless-stopped
